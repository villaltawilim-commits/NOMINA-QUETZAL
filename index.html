  /* ============================ PAGAR SUELDOS ============================ */
  function openPagarSueldos(){
    var ctx = { periodo: 'quincena1', fecha: todayISO(), cleanupSig: null };

    openSheet('Pagar sueldos', '<div id="ps-content"></div>', function(root){
      var content = root.querySelector('#ps-content');

      function computeFor(emp){
        var etiqueta = periodoEtiqueta(ctx.fecha, ctx.periodo);
        var pagoExistente = state.pagos.find(function(p){ return p.empleadoId === emp.id && p.periodoEtiqueta === etiqueta && p.estado === 'pagado'; });
        var loans = state.prestamos.filter(function(l){ return l.empleadoId === emp.id && l.estado === 'activo'; });
        var loanApplied = loans.filter(function(l){ return montoCuotaParaPeriodo(l, ctx.periodo) > 0; })
          .map(function(l){ return { prestamoId: l.id, concepto: l.concepto, monto: round2(Math.min(montoCuotaParaPeriodo(l, ctx.periodo), l.saldoPendiente)) }; });
        var loanSum = loanApplied.reduce(function(s,l){ return s + l.monto; }, 0);
        var igssOn = empIgssActivo(emp), isrOn = empIsrActivo(emp);
        var diasInfo = calcularDiasTrabajados(emp.fechaIngreso, ctx.fecha, ctx.periodo);
        var b = calcularDesglose(emp.salarioBase, emp.bonificacion!=null?emp.bonificacion:DEFAULT_BONIFICACION, ctx.periodo, loanSum, igssOn, isrOn, empFraccionQuincena1(emp), diasInfo);
        return { etiqueta: etiqueta, pagoExistente: pagoExistente, loanApplied: loanApplied, igssOn: igssOn, isrOn: isrOn, b: b, diasInfo: diasInfo };
      }

      function renderList(){
        if(ctx.cleanupSig){ ctx.cleanupSig(); ctx.cleanupSig = null; activeSheetCleanup = null; }
        var activos = ordenarPorIngreso(state.empleados.filter(function(e){ return e.activo !== false && e.empresaId === state.empresaActualId; }));
        var pagados = 0;
        var rows = activos.map(function(e){
          var info = computeFor(e);
          var pagado = !!info.pagoExistente;
          if(pagado) pagados++;
          var monto = pagado ? info.pagoExistente.totalNeto : info.b.totalNeto;
          var subLabel = esc(e.puesto||'') + (info.diasInfo ? ' · '+info.diasInfo.diasTrabajados+'/'+info.diasInfo.diasPeriodo+' días' : '');
          return '<div class="ledger-row pay-row">' +
            '<span class="status-bar '+(pagado?'good':'warning')+'"></span>' +
            '<span class="row-main"><span class="title">'+esc(e.nombre)+'</span><span class="sub">'+subLabel+'</span></span>' +
            '<span class="row-amount"><span class="amt">'+fmtQ(monto)+'</span></span>' +
            (pagado
              ? '<button class="btn btn-secondary row-action ver-firma-btn" data-emp="'+e.id+'">Ver firma</button>'
              : '<button class="btn btn-primary row-action pagar-btn" data-emp="'+e.id+'">Pagar</button>') +
          '</div>';
        }).join('');

        content.innerHTML =
          '<div class="field"><label>Periodo</label><div class="radio-group">' +
            '<label class="radio-chip"><input type="radio" name="ps-periodo" value="quincena1" '+(ctx.periodo==='quincena1'?'checked':'')+'/><span>Quincena 1</span></label>' +
            '<label class="radio-chip"><input type="radio" name="ps-periodo" value="quincena2" '+(ctx.periodo==='quincena2'?'checked':'')+'/><span>Quincena 2</span></label>' +
            '<label class="radio-chip"><input type="radio" name="ps-periodo" value="mensual" '+(ctx.periodo==='mensual'?'checked':'')+'/><span>Mensual</span></label>' +
          '</div></div>' +
          '<div class="field"><label for="ps-fecha">Fecha de pago</label><input id="ps-fecha" type="date" value="'+ctx.fecha+'"/></div>' +
          (activos.length ? '<p class="pay-count">'+pagados+' de '+activos.length+' empleados pagados · '+esc(periodoEtiqueta(ctx.fecha, ctx.periodo))+'</p>' : '') +
          (activos.length ? '<div class="ledger">'+rows+'</div>' : '<div class="empty-state"><div class="display">Sin empleados activos</div>Agrega empleados para poder pagarles.</div>');

        content.querySelectorAll('input[name=ps-periodo]').forEach(function(r){ r.addEventListener('change', function(){ ctx.periodo = r.value; renderList(); }); });
        var fechaInput = content.querySelector('#ps-fecha');
        if(fechaInput) fechaInput.addEventListener('change', function(){ ctx.fecha = fechaInput.value || todayISO(); renderList(); });

        content.querySelectorAll('.pagar-btn').forEach(function(btn){
          btn.addEventListener('click', function(){
            var emp = activos.find(function(e){ return e.id === btn.dataset.emp; });
            if(emp) renderSignature(emp);
          });
        });
        content.querySelectorAll('.ver-firma-btn').forEach(function(btn){
          btn.addEventListener('click', function(){
            var emp = activos.find(function(e){ return e.id === btn.dataset.emp; });
            var info = emp && computeFor(emp);
            if(info && info.pagoExistente){ closeSheet(); setTimeout(function(){ openPagoDetail(info.pagoExistente); }, 230); }
          });
        });
      }

      function renderSignature(emp){
        var info = computeFor(emp);
        var b = info.b;
        content.innerHTML =
          '<button class="btn btn-ghost" id="sig-volver" style="padding:4px 0;margin-bottom:8px;">‹ Volver a la lista</button>' +
          '<div class="view-head" style="margin-bottom:10px;"><h1 style="font-size:1.2rem;">'+esc(emp.nombre)+'</h1><p>'+esc(info.etiqueta)+'</p></div>' +
          (info.diasInfo ? '<div class="banner">Empleado nuevo: se le pagan '+info.diasInfo.diasTrabajados+' de '+info.diasInfo.diasPeriodo+' días de este periodo (ingresó el '+esc(emp.fechaIngreso)+').</div>' : '') +
          '<div class="breakdown">' +
            row('Salario base', b.salarioBase) + row('Bonificación incentivo', b.bonificacion) + row('Salario bruto', b.salarioBruto) +
            (info.igssOn? row('IGSS ('+fmtPct(getIgssRate())+')', -b.igss) : '<div class="breakdown-row"><span>IGSS</span><span>No aplica</span></div>') +
            (info.isrOn? row('ISR estimado', -b.isr) : '<div class="breakdown-row"><span>ISR</span><span>No aplica</span></div>') +
            info.loanApplied.map(function(l){
              return '<div class="breakdown-row"><span>Descuento por: '+esc(l.concepto)+'</span>' +
                '<span style="display:flex;align-items:center;gap:4px;">-Q <input type="number" class="loan-amt-input-firma" data-loan="'+l.prestamoId+'" value="'+l.monto+'" step="0.01" min="0" style="width:80px;text-align:right;border:1px solid var(--border);border-radius:8px;padding:4px 6px;"/></span></div>';
            }).join('') +
            '<div class="breakdown-row total"><span>Total a pagar</span><span class="amt" id="ps-total-neto">'+fmtQ(b.totalNeto)+'</span></div>' +
          '</div>' +
          '<div class="divider-label">Firma de recibido</div>' +
          '<div class="signature-box"><canvas id="firma-canvas"></canvas></div>' +
          '<div class="quick-actions" style="margin-top:10px;"><button class="btn btn-secondary btn-block" id="firma-borrar">Borrar firma</button></div>' +
          '<p class="hint">Pide al empleado que firme aquí para confirmar que recibió su pago.</p>' +
          '<button class="btn btn-primary btn-block" id="firma-confirmar" style="margin-top:14px;" disabled>Confirmar pago</button>';

        function row(label, val){ return '<div class="breakdown-row"><span>'+label+'</span><span class="amt">'+fmtQ(val)+'</span></div>'; }

        function loansEditados(){
          return info.loanApplied.map(function(l){
            var inp = content.querySelector('.loan-amt-input-firma[data-loan="'+l.prestamoId+'"]');
            return { prestamoId: l.prestamoId, concepto: l.concepto, monto: inp ? (Number(inp.value)||0) : l.monto };
          });
        }
        function recalcTotal(){
          var loanSumNuevo = loansEditados().reduce(function(s,l){ return s + l.monto; }, 0);
          var totalNuevo = round2(b.salarioBruto - b.igss - b.isr - loanSumNuevo);
          content.querySelector('#ps-total-neto').textContent = fmtQ(totalNuevo);
        }
        content.querySelectorAll('.loan-amt-input-firma').forEach(function(inp){ inp.addEventListener('input', recalcTotal); });

        var canvas = content.querySelector('#firma-canvas');
        var c2d = canvas.getContext('2d');
        var confirmBtn = content.querySelector('#firma-confirmar');
        var hasDrawn = false, drawing = false, lastX = 0, lastY = 0;

        function sizeCanvas(){
          var rect = canvas.getBoundingClientRect();
          canvas.width = Math.max(280, Math.round(rect.width));
          canvas.height = 170;
          c2d.lineWidth = 2.4; c2d.lineCap = 'round'; c2d.lineJoin = 'round'; c2d.strokeStyle = '#000000';
        }
        sizeCanvas();

        function pos(e){
          var rect = canvas.getBoundingClientRect();
          return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }
        function start(e){ e.preventDefault(); drawing = true; var p = pos(e); lastX = p.x; lastY = p.y; }
        function move(e){
          if(!drawing) return;
          e.preventDefault();
          var p = pos(e);
          c2d.beginPath(); c2d.moveTo(lastX, lastY); c2d.lineTo(p.x, p.y); c2d.stroke();
          lastX = p.x; lastY = p.y;
          if(!hasDrawn){ hasDrawn = true; confirmBtn.disabled = false; }
        }
        function stop(){ drawing = false; }
        canvas.addEventListener('pointerdown', start);
        canvas.addEventListener('pointermove', move);
        window.addEventListener('pointerup', stop);

        ctx.cleanupSig = function(){
          canvas.removeEventListener('pointerdown', start);
          canvas.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', stop);
        };
        activeSheetCleanup = ctx.cleanupSig;

        content.querySelector('#firma-borrar').addEventListener('click', function(){
          c2d.clearRect(0, 0, canvas.width, canvas.height);
          hasDrawn = false; confirmBtn.disabled = true;
        });
        content.querySelector('#sig-volver').addEventListener('click', function(){ renderList(); });

        confirmBtn.addEventListener('click', async function(){
          if(!hasDrawn) return;
          confirmBtn.disabled = true; confirmBtn.textContent = 'Guardando…';
          var firmaDataUrl = canvas.toDataURL('image/png');
          var fresh = computeFor(emp);
          var loanFinal = loansEditados();
          var loanSumFinal = loanFinal.reduce(function(s,l){ return s + l.monto; }, 0);
          var bFinal = Object.assign({}, fresh.b, {
            otrasDeducciones: round2(loanSumFinal),
            totalDeducciones: round2(fresh.b.igss + fresh.b.isr + loanSumFinal),
            totalNeto: round2(fresh.b.salarioBruto - fresh.b.igss - fresh.b.isr - loanSumFinal)
          });
          var data = Object.assign({
            empleadoId: emp.id, empleadoNombre: emp.nombre, puesto: emp.puesto||'', empresaId: state.empresaActualId,
            periodoTipo: ctx.periodo, periodoEtiqueta: fresh.etiqueta,
            fechaPago: ctx.fecha, estado: 'pagado',
            otrasDeduccionesManual: 0, otrasDeduccionesNota: '',
            prestamosAplicados: loanFinal, diasTrabajados: fresh.diasInfo,
            firma: firmaDataUrl, firmadoEn: new Date().toISOString(),
            registradoPor: state.session.nombre, creadoEn: new Date().toISOString()
          }, bFinal);
          try{
            await state.db.collection('pagos').add(data);
            for(var i=0;i<loanFinal.length;i++){
              var la = loanFinal[i];
              var loan = state.prestamos.find(function(l){ return l.id === la.prestamoId; });
              if(!loan) continue;
              var nuevoSaldo = round2(Math.max(0, loan.saldoPendiente - la.monto));
              await state.db.collection('prestamos').doc(loan.id).update({
                saldoPendiente: nuevoSaldo,
                cuotasAplicadas: (loan.cuotasAplicadas||0) + 1,
                estado: nuevoSaldo <= 0.01 ? 'completado' : 'activo'
              });
            }
            toast('Pago confirmado');
            renderList();
          }catch(e){
            toast('No se pudo guardar: '+(e.code||''), true);
            confirmBtn.disabled = false; confirmBtn.textContent = 'Confirmar pago';
          }
        });
      }

      renderList();
    });
  }

    });

  function buildFirmaConResponsable(responsable, puestoResponsable, labelDer){
    var izq = '<div class="sig-block"><div class="sig-line"></div>'+esc(responsable)+(puestoResponsable?'<br>'+esc(puestoResponsable):'')+'<br>'+esc(empresaActual().nombre)+'</div>';
    var der = labelDer ? '<div class="sig-block"><div class="sig-line"></div>'+esc(labelDer)+'</div>' : '';
    return '<div class="doc-signature">' + izq + der + '</div>';
  }

  function openDocumentoDetail(d){
    var meta = TIPOS_DOCUMENTO[d.tipo] || { nombre: d.tipo };
    var body =
      '<div>' + d.contenidoHtml + '</div>' +
      '<div style="margin-top:24px;">' +
        '<div class="breakdown-row" style="padding:0 2px;"><span>Generado por</span><span>'+esc(d.generadoPor||'—')+'</span></div>' +
        '<button class="btn btn-primary btn-block" id="doc-descargar" style="margin-top:14px;">Descargar PDF</button>' +
        '<p class="hint">Se descarga listo en tamaño carta, para imprimir y firmar.</p>' +
        '<button class="btn btn-danger btn-block" id="doc-eliminar" style="margin-top:8px;">Eliminar documento</button>' +
      '</div>';
    openSheet(meta.nombre, body, function(root){
      root.querySelector('#doc-descargar').addEventListener('click', function(){ descargarDocumentoHtml(d, meta); });
      root.querySelector('#doc-eliminar').addEventListener('click', async function(){
        if(!confirm('¿Eliminar este documento? Esta acción no se puede deshacer.')) return;
        try{ await state.db.collection('documentos').doc(d.id).delete(); toast('Documento eliminado'); closeSheet(); }
        catch(e){ toast('No se pudo eliminar: '+(e.code||''), true); }
      });
    });
  }

  function descargarDocumentoHtml(d, meta){
    if(!window.html2pdf){ toast('No se pudo cargar el generador de PDF, revisa tu conexión e intenta de nuevo', true); return; }
    var titulo = meta.nombre + ' - ' + d.empleadoNombre;
    var estilos =
      '*{ box-sizing:border-box; }' +
      '.pdf-page{ background:#fff; font-family:Georgia,"Times New Roman",serif; color:#161616; width:8.5in; min-height:11in; padding:2.5cm; }' +
      '.pdf-page .letterhead{ display:flex; align-items:center; gap:18px; padding-bottom:16px; margin-bottom:8px; border-bottom:3px solid #1450D8; }' +
      '.pdf-page .letterhead img{ width:70px; height:70px; object-fit:contain; flex-shrink:0; }' +
      '.pdf-page .letterhead .lh-name{ font-weight:700; font-size:1.35rem; letter-spacing:.01em; }' +
      '.pdf-page .letterhead .lh-detail{ font-size:.85rem; color:#555; margin-top:4px; line-height:1.4; }' +
      '.pdf-page .letterhead-rule{ height:1px; background:#111; opacity:.15; margin-bottom:26px; }' +
      '.pdf-page h3{ text-align:center; letter-spacing:.06em; margin:0 0 22px; font-size:1.05rem; }' +
      '.pdf-page p{ margin:0 0 14px; line-height:1.4; text-align:justify; font-size:.98rem; }' +
      '.pdf-page strong{ font-weight:700; }' +
      '.pdf-page .doc-signature{ margin-top:6cm; display:flex; gap:32px; flex-wrap:wrap; }' +
      '.pdf-page .sig-block{ flex:1; min-width:170px; text-align:center; font-size:.92rem; line-height:1.4; }' +
      '.pdf-page .sig-line{ border-top:1px solid #111; margin-bottom:8px; padding-top:8px; }' +
      '.pdf-page .doc-table{ width:100%; border-collapse:collapse; margin:16px 0; font-size:.94rem; }' +
      '.pdf-page .doc-table td{ padding:7px 4px; border-bottom:1px solid #ccc; }' +
      '.pdf-page .doc-table td:last-child{ text-align:right; font-family:"Courier New",monospace; }' +
      '.pdf-page .doc-table tr.total td{ font-weight:700; border-top:2px solid #111; border-bottom:none; padding-top:9px; }' +
      '.pdf-page .doc-footer{ margin-top:40px; padding-top:12px; border-top:1px solid #bbb; text-align:center; font-size:.78rem; color:#555; letter-spacing:.01em; }';

    var contenedor = document.createElement('div');
    contenedor.style.position = 'fixed';
    contenedor.style.left = '-10000px';
    contenedor.style.top = '0';
    contenedor.style.width = '8.5in';
    contenedor.innerHTML = '<style>'+estilos+'</style><div class="pdf-page">' + d.contenidoHtml + '</div>';
    document.body.appendChild(contenedor);
    var elPagina = contenedor.querySelector('.pdf-page');

    toast('Generando PDF…');
    html2pdf().set({
      margin: 0,
      filename: titulo.replace(/[^a-zA-Z0-9 _-]/g, '') + '.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] }
    }).from(elPagina).save().then(function(){
      document.body.removeChild(contenedor);
      toast('PDF descargado, listo para firmar');
    }).catch(function(){
      document.body.removeChild(contenedor);
      toast('No se pudo generar el PDF', true);
    });
  }

  function openEmpresaForm(){
    var body =
      '<div class="field"><label for="em-nombre">Nombre de la empresa</label><input id="em-nombre" placeholder="Ej. Importadora Viflo"/></div>' +
      '<div class="field"><label for="em-codigo">Código de autorización</label><input id="em-codigo" placeholder="Ej. AB12CD34" style="text-transform:uppercase;"/></div>' +
      '<p class="disclaimer">Cada cuenta incluye una sola empresa. Para crear una empresa adicional necesitas un código de autorización del proveedor del sistema — contáctalo ('+esc(CONTACTO_SOPORTE)+') para obtenerlo.</p>' +
      '<button class="btn btn-primary btn-block" id="em-submit" style="margin-top:6px;">Crear empresa</button>';
    openSheet('Nueva empresa', body, function(root){
      root.querySelector('#em-submit').addEventListener('click', async function(){
        var nombre = root.querySelector('#em-nombre').value.trim();
        var codigo = root.querySelector('#em-codigo').value.trim().toUpperCase();
        if(!nombre){ toast('Escribe el nombre de la empresa', true); return; }
        if(!codigo){ toast('Escribe el código de autorización', true); return; }
        try{
          var codSnap = await state.db.collection('codigosEmpresa').doc(codigo).get();
          if(!codSnap.exists){ toast('Código inválido', true); return; }
          if(codSnap.data().usado){ toast('Este código ya fue usado', true); return; }
          var ref = await state.db.collection('empresas').add({ nombre: nombre, creadaPor: state.session.nombre, creadaEn: new Date().toISOString() });
          var miembro = state.equipo.find(function(m){ return m.id === state.session.id; });
          var acc = (miembro && miembro.empresasAcceso) || [];
          await state.db.collection('equipo').doc(state.session.id).update({ empresasAcceso: acc.concat([ref.id]) });
          await state.db.collection('codigosEmpresa').doc(codigo).update({ usado: true, usadoPor: state.session.nombre, usadoEn: new Date().toISOString() });
          state.empresaActualId = ref.id;
          toast('Empresa creada'); closeSheet();
        }catch(e){ toast('No se pudo crear: '+(e.code||''), true); }
      });
    });
  }

      '<div class="divider-label">Usuarios con acceso</div>' +
      (miembros.length === 0 ? '<div class="empty-state">Sin usuarios en el equipo todavía</div>' :
        miembros.map(function(m){
          var tiene = (m.empresasAcceso||[]).indexOf(empresa.id) > -1;
          return '<label class="loan-check"><input type="checkbox" class="acc-cb" data-id="'+m.id+'" '+(tiene?'checked':'')+'/>' +
            '<span class="lc-text"><span class="t1">'+esc(m.nombre)+'</span><span class="t2">'+(m.rol==='administrador'?'Administrador':'Editor de nómina')+'</span></span>' +
          '</label>';
        }).join('')
      ) +
      '<button class="btn btn-primary btn-block" id="ed-submit" style="margin-top:14px;">Guardar cambios</button>' +
      '<button class="btn btn-danger btn-block" id="ed-delete" style="margin-top:8px;">Eliminar empresa</button>';
    openSheet(esc(empresa.nombre), body, function(root){
      var nuevoLogoDataUrl = null;
      root.querySelector('#ed-logo-file').addEventListener('change', function(e){
        var file = e.target.files[0];
        if(!file) return;
        var img = new Image();
        var reader = new FileReader();
        reader.onload = function(ev){
          img.onload = function(){
            var maxSide = 240;
            var w = img.width, h = img.height;
            var scale = Math.min(1, maxSide / Math.max(w,h));
            var canvas = document.createElement('canvas');
            canvas.width = Math.round(w*scale); canvas.height = Math.round(h*scale);
            var c2d = canvas.getContext('2d');
            c2d.drawImage(img, 0, 0, canvas.width, canvas.height);
            nuevoLogoDataUrl = canvas.toDataURL('image/png');
            root.querySelector('#ed-logo-preview').innerHTML = '<img src="'+nuevoLogoDataUrl+'" style="width:100%;height:100%;object-fit:contain;"/>';
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      root.querySelector('#ed-delete').addEventListener('click', async function(){
        var nEmpleados = state.empleadosMultiEmpresa.filter(function(e){ return e.empresaId === empresa.id; }).length;
        var msg = nEmpleados > 0
          ? '¿Eliminar "'+empresa.nombre+'"? Tiene '+nEmpleados+' empleado(s) registrados — sus datos no se borrarán, pero quedarán inaccesibles desde la app al eliminar la empresa. Esta acción no se puede deshacer.'
          : '¿Eliminar "'+empresa.nombre+'"? Esta acción no se puede deshacer.';
        if(!confirm(msg)) return;
        try{
          await state.db.collection('empresas').doc(empresa.id).delete();
          toast('Empresa eliminada'); closeSheet();
        }catch(e){ toast('No se pudo eliminar: '+(e.code||''), true); }
      });
      root.querySelector('#ed-submit').addEventListener('click', async function(){
        var nombre = root.querySelector('#ed-nombre').value.trim();
        if(!nombre){ toast('El nombre es obligatorio', true); return; }
        try{
          var datosEmpresa = {
            nombre: nombre,
            ciudad: root.querySelector('#ed-ciudad').value.trim(),
            direccion: root.querySelector('#ed-direccion').value.trim(),
            telefono: root.querySelector('#ed-telefono').value.trim()
          };
          if(nuevoLogoDataUrl) datosEmpresa.logoDataUrl = nuevoLogoDataUrl;
          await state.db.collection('empresas').doc(empresa.id).update(datosEmpresa);
          var checks = root.querySelectorAll('.acc-cb');
          for(var i=0;i<checks.length;i++){
            var cb = checks[i];
            var miembro = state.equipo.find(function(m){ return m.id === cb.dataset.id; });
            if(!miembro) continue;
            var acc = miembro.empresasAcceso || [];
            var tiene = acc.indexOf(empresa.id) > -1;
            if(cb.checked && !tiene){
              await state.db.collection('equipo').doc(miembro.id).update({ empresasAcceso: acc.concat([empresa.id]) });
            } else if(!cb.checked && tiene){
              await state.db.collection('equipo').doc(miembro.id).update({ empresasAcceso: acc.filter(function(id){ return id !== empresa.id; }) });
            }
          }
          toast('Empresa actualizada'); closeSheet();
        }catch(e){ toast('No se pudo guardar: '+(e.code||''), true); }
      });
    });
  }

        root.querySelector('#pf-exen').value = EXENCION_ANUAL_ISR_DEFAULT;
      });
      root.querySelector('#pf-submit').addEventListener('click', async function(){
        var data = {
          igssRate: round4(Number(root.querySelector('#pf-igss').value)/100),
          isrTasa1: round4(Number(root.querySelector('#pf-t1').value)/100),
          isrTope1: round2(root.querySelector('#pf-tope1').value),
          isrTasa2: round4(Number(root.querySelector('#pf-t2').value)/100),
          isrExencionAnual: round2(root.querySelector('#pf-exen').value)
        };
        try{ await state.db.collection('empresas').doc(state.empresaActualId).update(data); toast('Parámetros actualizados'); closeSheet(); }
        catch(e){ toast('No se pudo guardar: '+(e.code||''), true); }
      });
    });
  }

  /* ============================ GLOBAL WIRING ============================ */
  document.getElementById('tabbar').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-tab]');
    if(!btn || btn.hidden) return;
    state.tab = btn.dataset.tab;
    render();
  });
  document.getElementById('fab-btn').addEventListener('click', function(){
    if(state.tab === 'comisiones') openComisionForm(null);
    else if(state.tab === 'documentos') openDocumentoTipoPicker(null);
    else openPagoForm();
  });
  document.getElementById('who-btn').addEventListener('click', function(){
    if(!confirm('¿Cerrar sesión?')) return;
    signOut(auth);
  });
  document.getElementById('empresa-switcher').addEventListener('change', function(e){
    state.empresaActualId = e.target.value;
    render();
  });
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
